<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <!-- metadatos para adaptar la página a dispositivos móviles -->
        <title>MarketOps - Inicio de Sesión</title>

        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <main>
            <h1>MarketOps</h1>
            <!-- Formulario -->
            <form id="formLogin" action="" method="">
                <div> <!-- contenedor para ingresar correo electrónico-->
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" name="correo" id="correo" placeholder="usuario@marketops.com" required>
                </div>

                <div> <!-- contenedor para ingresar la contraseña-->
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" placeholder="********" required>
                </div>

                <button type="submit">Iniciar Sesión</button> <!-- botón para confirmar el ingreso al portal-->
            </form>
        </main>
    </body>
</html>
