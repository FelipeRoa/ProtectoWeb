<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte - Historial de Incidencias</title>
    <link rel="stylesheet" href="../css/usu.css"> <!--con esto dejamos bonito la paguina-->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script> <!-- cargamos alpinejs conn el defer-->
</head>
<body x-data="historialIncidencias()"> <!--dejamos listo que esta clase trabaje con alpinejs-->
    <header>
        <h1>Historial de Incidencias</h1>
        <nav>
            <a href="panel.html">Panel</a> | 
            <a href="incidencias.html">Historial</a> | 
            <a href="../index.html">Salir</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Consultar Historial por Sucursal</h2> 
            
            <label>Filtrar Sucursal: 
                    <select x-model="sucursalSeleccionada"><!-- con esto dejamos un selecionador dinamico-->
                    <option value="Todas">Todas las sucursales</option>
                    <option value="Sucursal Central">Sucursal Central</option>
                    <option value="Sucursal sur">Sucursal sur</option>
                    <option value="Sucursal norte">Sucursal norte</option>
                </select>
            </label>

            <table border="1">
                <thead>
                    <tr>
                        <th>ID Falla</th> <!--titulo de cada cuadro en la tabla-->
                        <th>Sucursal</th>
                        <th>Equipo</th>
                        <th>Descripción</th>
                        <th>Fecha Reporte</th>
                        <th>Fecha Resolución</th>
                    </tr>
                </thead>
                <tbody> <!--antes teniamos anotado cada falla, y ahora generamos un bucle de cada incidencia-->
                  <template x-for="inc in incidenciasFiltradas" :key="inc.id"> 
                        <tr>
                            <td x-text="inc.id"></td>
                            <td x-text="inc.sucursal"></td>
                            <td x-text="inc.equipo"></td>
                            <td x-text="inc.descripcion"></td>
                            <td x-text="inc.fechaReporte"></td>
                            <td x-text="inc.fechaResolucion"></td>
                        </tr>
                    </template>
                    <template x-if="incidenciasFiltradas.length === 0"> <!--si no esta el que eligimos, suelta ese mensaje-->
                        <tr>
                            <td colspan="6" style="text-align: center;">No hay incidencias registradas para esta sucursal.</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        function historialIncidencias() {
            return {
                sucursalSeleccionada: 'Todas', // lo mismo que en detalle-sucursal, generamos datos de prueba para que se vea bonito y no este vacio
                incidencias: [
                    { id: 'Falla-1', sucursal: 'Sucursal Central', equipo: 'a-1 (Caja 1)', descripcion: 'Fallo en la pantalla táctil', fechaReporte: '2026-09-01', fechaResolucion: '2026-09-02' },
                    { id: 'Falla-2', sucursal: 'Sucursal sur', equipo: 'a-2 (Balanza)', descripcion: 'Descalibración en el peso', fechaReporte: '2026-09-05', fechaResolucion: 'En revisión' },
                    { id: 'Falla-3', sucursal: 'Sucursal Norte', equipo: 'a-3 (impr)', descripcion: 'Fallo en el láser', fechaReporte: '2026-09-10', fechaResolucion: 'Sin resolver' }
                ],
                get incidenciasFiltradas() { //con este generamos el cambio de la sucursal que queremos ver
                    if (this.sucursalSeleccionada === 'Todas') return this.incidencias;
                    return this.incidencias.filter(inc => inc.sucursal.toLowerCase() === this.sucursalSeleccionada.toLowerCase());
                }
            }
        }
    </script>

    <script src="../js/main.js"></script>
</body>
</html>
