<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Falla</title>

    <link rel="stylesheet" href="../css/reportado.css">
</head>
<body>
    <header>
        <h1>Reporte de Falla</h1>
        <nav>
            <a href="inicio.mi-sucursal.html">Volver a --> Inicio - Mi Sucursal</a>
        </nav>
    </header>

    <main>
        <form id="formReporte"> <!--cree otro css pq mucho texto en el usu-->
            <h3>Registrar incidencia</h3>

            <div>
                <label for="sucursal">Número de sucursal</label>
                <input type="number" id="sucursal" name="sucursal" required>
            </div>

            <div>
                <label for="equipo">Nombre de equipo</label>
                <input type="text" id="equipo" name="equipo" required>
            </div>

            <div>
                <label for="estadoEquipo">Estado actual del equipo</label>
                <input type="text" id="estadoEquipo" name="estadoEquipo" required>
            </div>

            <div>
                <label for="detalle">Detalles de la incidencia</label>
                <textarea id="detalle" name="detalle" required></textarea>
            </div>

            <div class="acc-form">
                <button type="submit">Reportar incidencia</button>
            </div>
        </form>
    </main>
</body>
</html>
